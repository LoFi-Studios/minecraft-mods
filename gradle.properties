org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# ============================================================
# Fabric and Minecraft versions — shared by every mod in this
# repo, on purpose. They all target the same Minecraft version,
# so bumping happens once, here, and nowhere else.
#
# Check current values on https://fabricmc.net/develop and in
# gradle.properties of FabricMC/fabric-example-mod on the branch
# matching our Minecraft version. Do not copy them from a tutorial.
# ============================================================
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Per-mod values (version, group, mod-specific dependencies) live in
# <mod>/build.gradle, so one mod can move on without touching the rest.
